<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 5</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

    <main class="container mt-5">
        <h1 class="text-center mb-4">Lista de Tarefas</h1>

        <div class="card">
            <div class="card-body">

                <div class="mb-3">
                    <label class="form-label">Nova tarefa</label>
                    <input 
                      type="text" 
                      id="inputTarefa" 
                      class="form-control"
                      placeholder="Digite a tarefa">
                </div>

                <button id="btnAdicionar" class="btn btn-primary">
                    Adicionar
                </button>

                <hr>

                <p id="mensagem" class="fw-bold"></p>

                <ul id="listaTarefas" class="list-group mt-3">
    
<script>
    const inputTarefa = document.querySelector('#inputTarefa');
    const btnAdicionar = document.querySelector('#btnAdicionar');
    const listaTarefas = document.querySelector('#listaTarefas');
    const mensagem = document.querySelector('#mensagem');

    btnAdicionar.addEventListener('click', () => {
        const texto = inputTarefa.value.trim();

        if (texto === "") {
            mensagem.textContent = "Tarefa vazia!! Adicione algo";
            mensagem.className = "fw-bold text-danger";
            return;
        }

        const novoItem = document.createElement('li');
        novoItem.className = "list-group-item d-flex justify-content-between align-items-center";

        const containerEsq = document.createElement('div');
        containerEsq.className = "d-flex align-items-center gap-2";

        // Cria o Checkbox
        const checkbox = document.createElement('input');
        checkbox.type = "checkbox";
        checkbox.className = "form-check-input mt-0";

        //  Cria o Span do texto
        const spanTexto = document.createElement('span');
        spanTexto.textContent = texto;

        checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
                spanTexto.style.textDecoration = "line-through";
                spanTexto.classList.add('text-muted');
                mensagem.textContent = "Tarefa concluída com sucesso!!";
                mensagem.className = "fw-bold text-info";
            } else {
                spanTexto.style.textDecoration = "none";
                spanTexto.classList.remove('text-muted');
                mensagem.textContent = "Tarefa reaberta.";
                mensagem.className = "fw-bold text-secondary";
            }
        });

        //  Cria o Botão Remover
        const btnRemover = document.createElement('button');
        btnRemover.textContent = "Remover";
        btnRemover.className = "btn btn-outline-danger btn-sm";
        btnRemover.addEventListener('click', () => novoItem.remove());

        containerEsq.appendChild(checkbox);
        containerEsq.appendChild(spanTexto);
        
        novoItem.appendChild(containerEsq);
        novoItem.appendChild(btnRemover);

        listaTarefas.appendChild(novoItem);

        inputTarefa.value = "";
        inputTarefa.focus();
        mensagem.textContent = "Tarefa adicionada!";
        mensagem.className = "fw-bold text-success";
    });
</script>
</script>
                </ul>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
