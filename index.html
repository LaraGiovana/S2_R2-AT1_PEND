<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa 1 - Saudação DOM (Bootstrap)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            background-color: #ec5fe3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card shadow-sm border-0 p-4 text-center">
                    <h2 class="card-title mb-4">Boas-vindas</h2>
                    
                    <div class="mb-3">
                        <input type="text" id="nomeInput" class="form-control form-control-lg" placeholder="Digite seu nome aqui...">
                    </div>
                    
                    <button id="btnBoasVindas" class="btn btn-primary btn-lg w-100">Enviar</button>
                    
                    <div id="mensagem" class="mt-4 fw-bold"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const inputNome = document.querySelector('#nomeInput');
        const botao = document.querySelector('#btnBoasVindas');
        const displayMensagem = document.querySelector('#mensagem');

        botao.addEventListener('click', () => {
            const nome = inputNome.value.trim();

            if (nome !== "") {
                displayMensagem.textContent = `Olá, ${nome}! Seja bem-vindo(a).`;
                displayMensagem.className = "mt-4 fw-bold text-success"; 
                inputNome.value = ""; 
            } else {
                displayMensagem.textContent = "Por favor, digite um nome válido.";
                displayMensagem.className = "mt-4 fw-bold text-danger"; 
            }
        });
    </script>
</body>
</html>
