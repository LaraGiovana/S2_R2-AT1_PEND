<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa 2 - Alterar Texto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            background-color: #e9ecef;
        }
        .card {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-5 border-0">
                    
                    <h3 id="textoPrincipal" class="mb-4 text-muted">
                        Não chore bb (clique no botão)
                    </h3>
                    
                    <button id="btnMudar" class="btn btn-dark btn-lg">
                        Mudar Texto
                    </button>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const texto = document.querySelector('#textoPrincipal');
        const botao = document.querySelector('#btnMudar');

        botao.addEventListener('click', () => {
            
            texto.textContent = "vc é linda";
            
            texto.classList.remove('text-muted');
            texto.classList.add('text-primary', 'fst-italic');
            
            botao.textContent = "Texto Alterado!";
            botao.disabled = true;
        });
    </script>

</body>
</html>
