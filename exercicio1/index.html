<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa 1 - Saudação DOM</title>
    <style>

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }

        h2 { color: #333; margin-bottom: 1.5rem; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus { border-color: #007bff; }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        button:hover { background-color: #0056b3; }

        #mensagem {
            margin-top: 1.5rem;
            min-height: 1.2em;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Boas-vindas</h2>
        <input type="text" id="nomeInput" placeholder="Digite seu nome aqui...">
        <button id="btnBoasVindas">Enviar</button>
        <p id="mensagem"></p>
    </div>

    <script>

        const inputNome = document.querySelector('#nomeInput');
        const botao = document.querySelector('#btnBoasVindas');
        const displayMensagem = document.querySelector('#mensagem');

        botao.addEventListener('click', () => {
            const nome = inputNome.value.trim();

            if (nome !== "") {
                displayMensagem.textContent = `Olá, ${nome}! Seja bem-vindo(a).`;
                displayMensagem.style.color = "#28a745"; 
                inputNome.value = ""; 
            } else {
                displayMensagem.textContent = "Por favor, digite um nome válido.";
                displayMensagem.style.color = "#dc3545"; 
            }
        });
    </script>
</body>
</html>
